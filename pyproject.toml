[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maass-forms-experiment"
version = "0.2.0"
description = "Experimental Fourier–Bessel collocation for modular Maass cusp forms"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "mpmath>=1.3,<2", "matplotlib>=3.7,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
maass-forms = "maass_pipeline:main"

[tool.setuptools]
py-modules = ["maass_pipeline"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
